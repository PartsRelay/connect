[package]
name = "partsrelay-grpc"
version = "0.0.0"
description = "The gRPC link between connect and the Parts Relay core"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
prost = "0.14.6"
tokio = { version = "1.54", features = ["net"] }
tonic = "0.14.9"
tonic-health = "0.14.9"
tonic-prost = "0.14.9"

[build-dependencies]
protoc-bin-vendored = "3.3.0"
tonic-prost-build = "0.14.9"

[dev-dependencies]
tokio = { version = "1.54", features = ["macros", "rt-multi-thread", "sync"] }
